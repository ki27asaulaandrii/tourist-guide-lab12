appId: com.example.tourist_guide
---
- launchApp:
    clearState: true
# Назва, опис і рейтинг об'єднані в один підпис доступності, тому потрібен регулярний вираз
- extendedWaitUntil:
    visible: 'Фонтан Рошен[\s\S]*'
    timeout: 10000
- tapOn:
    text: "Додати в обране"
    index: 0
- assertVisible: "Прибрати з обраного"
- assertVisible: "1"
- takeScreenshot: maestro_01_home
# Коли є лічильник, текст доступності кнопки обраного складається лише з числа, підказки "Обране" в ньому немає
- tapOn: "1"
# Перевірка, що відкрився саме екран обраного
- assertVisible: "Обране"
- assertVisible: 'Фонтан Рошен[\s\S]*'
- assertNotVisible: 'Софійський собор[\s\S]*'
- assertNotVisible: "Обраних місць немає"
- takeScreenshot: maestro_02_favorites
