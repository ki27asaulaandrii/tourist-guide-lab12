name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit-тести
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.4"
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/ --coverage

  e2e-windows:
    name: E2E (integration_test, Windows)
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.4"
          cache: true
      - run: flutter create . --platforms=windows
      - run: flutter pub get
      - run: flutter test integration_test -d windows

  e2e-maestro:
    name: E2E (Maestro, Android)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.4"
          cache: true
      - run: flutter create . --platforms=android --org com.example
      - run: flutter pub get
      - run: flutter build apk --debug
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: |
            adb install build/app/outputs/flutter-apk/app-debug.apk
            maestro test .maestro/favorites.yaml
